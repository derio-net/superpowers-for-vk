# Workspace root — the four packages live under packages/.
# Lockstep versioning: scripts/bump-version.py writes every member +
# both plugin manifests; the version-sync CI job checks the set.
[project]
name = "super-fr-workspace"
version = "4.1.0"
description = "super-fr workspace root (fr / fr-dispatch / fr-vk / fr-cncd)"
requires-python = ">=3.11"
dependencies = ["fr", "fr-dispatch", "fr-vk", "fr-cncd"]

[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/fr-opencode-plugin"]

[tool.uv.sources]
fr = { workspace = true }
fr-dispatch = { workspace = true }
fr-vk = { workspace = true }
fr-cncd = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0.12.20260408",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# The report stylesheet is a verbatim CSS block; splitting its rules to fit
# the Python line limit would make every diff against the reference noisy.
"packages/fr/src/fr/acceptance/report.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=fr --cov=fr_dispatch --cov=fr_vk --cov=fr_cncd --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
omit = ["packages/fr/src/fr/__main__.py"]

[tool.mypy]
strict = true
python_version = "3.11"
