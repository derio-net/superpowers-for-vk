      - super-fr:tests/integration/test_fr_goal_shape.py
      - super-fr:tests/integration/test_run_workspace_lifecycle.py
    status: ci
    notes: >-
      Spec 4.B. docs/superpowers/runs/<run-id>.yaml, git-tracked, archives to
      implemented/runs/ alongside its plan. Durability: byte-stable YAML round-trip
      (test_run_state.py) plus git mv on archive, mirroring _archive_journal.
      Resumability is exercised end-to-end, not merely in-memory: every `fr run`
      CLI test issues separate start/advance/status/resolve/check invocations that
      each reload state from disk, so a step surviving process exit -- including a
      gate: operator step left blocked and picked back up later -- is what the
      tests actually pin. Audit: `fr run status` prints the cursor and every
      step's state. `fr run advance` never invokes a model (kind: cli executes
      directly and captures exit+stdout; kind: agent only emits a dispatch brief
      and marks itself running), asserted by monkeypatching subprocess.run to
      raise if called on the agent-step path. `fr run resolve` (added in
      milestone review, spec amended: the original 4-command CLI could mark an
      agent step running but never move it to done, wedging every real run on
      its first agent step) records that step's outcome via the same done/failed
      cursor-advance logic advance's cli branch uses (_complete_step, shared not
      forked) and is equally non-executing. Archival is keyed on the DATA a run
      file already carries (the plan step's emitted.plan path), not on any
      run-id/plan-slug name convention -- a name-keyed version landed first and
      silently never matched in real use (run ids are date+branch-derived, plan
      slugs are authored independently), caught by a fixture using a
      deliberately unrelated run id and plan slug (test_archive_cmd.py); a
      same-name fixture would have hidden the bug. Phase 7.
      Milestone review r2 corrected two claims this row's notes had already made
      but nothing proved. (1) "a gate: operator step ... picked back up later"
      was false: `advance` marked a gated step blocked and `resolve` refused
      anything not `running`, so the shipped fr-goal shape -- whose SECOND step
      is agent+gate -- wedged permanently, verified against the real CLI. The
      old gate tests asserted only that a step BECOMES blocked, never that it
      can be cleared; `resolve` now clears one (an agent step completes, a cli
      step's gate is cleared so the next `advance` still executes it and its
      exit code is still the verdict), pinned at fixture level in test_run_cli.py
      AND at shape level in test_fr_goal_shape.py, which walks the SHIPPED
      manifest start -> blocked brainstorm -> resolve -> the next step's brief.
      (2) Durability now means durable IN THE WORKSPACE (spec 4.B amended): `fr
      run start` ensures isolation itself and writes the run file inside the
      resulting worktree, so `advance` from the worktree finds its own run and
      cli steps run with cwd at the workspace root -- test_run_workspace.py
      covers the marker/reuse/refusal paths, and test_run_workspace_lifecycle.py
      walks a REAL host-worktree isolation (no docker) asserting the base clone
      comes away with no run file at all. The shipped shape's `isolate` step is
      gone; isolation is a precondition, not a step the run performs on itself.
