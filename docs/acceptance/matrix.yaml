  - id: isolation-gc-reconciles-merged
    capability: Isolation teardown
    acceptance: A merged isolation workspace is torn down (container, worktree, state,
      image) without the originating session — host-wide, fired opportunistically on
      every up/down, bounded to <=1 stale workspace with no daemon. "Merged" covers a
