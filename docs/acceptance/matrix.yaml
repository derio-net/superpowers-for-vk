  - id: run-cursor-durable
    capability: Run state
    acceptance: A run's step cursor and emitted artifacts are durable and reviewable
      in the PR, so a run can be audited or resumed mid-flight.
    origin:
    - super-fr:docs/superpowers/implemented/specs/2026-08-14-workflow-shapes-and-workitem-dispatch-design.md
    levels:
      unit:
      - super-fr:tests/unit/test_run_state.py
