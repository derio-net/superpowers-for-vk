- number: 2
  title: GREEN — rule, install.sh, .gitignore
  steps:
  - id: P6.T2.S1
    text: |
      GREEN: create plugins/super-fr/rules/fr-worktree-override.md:

      # Worktree Skill Override (fr-enabled repos)

      In a repo with fr plans (`docs/superpowers/plans/`) or devcontainer profiles
      (`.devcontainer/<profile>/`), any skill or instruction that would invoke
      `superpowers:using-git-worktrees` — "work in a worktree", "isolate this",
      executing-plans' isolation step — invokes `fr-isolation` instead:

          fr isolation up --branch <feat/slug>

      Never create `<repo>/.worktrees/`. fr owns the location
      (`~/.cache/fr/worktrees/<main-checkout>/<branch-slug>`), the state, and the
      session binding (`fr isolation status` shows which sessions hold a workspace).

      `claude --worktree <name>` and the `EnterWorktree` tool need no override:
      super-fr's `WorktreeCreate` hook already lands them in fr (subagent worktrees,
      `agent-*`, keep Claude's default shape on purpose). Plain
      `using-git-worktrees` remains for non-fr repos.

      In scripts/install.sh add after the no-claude-p-batch.md cp:
      `cp "$PLUGIN_ROOT/plugins/super-fr/rules/fr-worktree-override.md" "$RULES_DIR/fr-worktree-override.md"`
      `echo "  Installed $RULES_DIR/fr-worktree-override.md (worktree-skill routing)"`
      and in the uninstall block next to the fr-plan-override rm: `rm -f "$RULES_DIR/fr-worktree-override.md"`.
      Append `.worktrees/` and `.claude/worktrees/` to .gitignore if missing. If the Hermes
      rules-sync tripwire enumerates plugin rules, add the new rule to its source list
      (`fr hermes install` block generator) the same way the other three are listed.
      Run Task 1 tests + the whole unit suite, confirm green.
- number: 3
  title: Docs
  steps:
  - id: P6.T3.S1
    text: |
      Docs: (1) plugins/super-fr/skills/fr-isolation/SKILL.md — new section
      "## Session bindings (traceability)" after "Exec-bridge discipline": attach/detach verbs,
      `~/.cache/fr/sessions/<id>.json` shape, `status --session`, `up --session/--print-path`,
      `down --worktree`, the Claude hooks that call them, and this operator status-line snippet:

          # ~/.claude/statusline.sh — line 2/3 (after computing $branch_str and $cwd_str)
          seg=$(printf '%s' "$data" | bash ~/.claude/plugins/cache/derio-net--super-fr/super-fr/current/scripts/fr-statusline-segment.sh)
          iso_line=$(printf '%s\n' "$seg" | sed -n '1p'); wt_line=$(printf '%s\n' "$seg" | sed -n '2p')
          line2="${branch_str}${SEP}${cwd_str}"; [ -n "$iso_line" ] && line2="${line2}${SEP}${DIM}${iso_line}${RESET}"
          echo -e "$line2"; [ -n "$wt_line" ] && echo -e "${DIM}${wt_line}${RESET}"

      (2) plugins/super-fr/rules/fr-isolation-required.md — one paragraph under "Scope":
      session bindings are traceability, not enforcement; the edit gate is unchanged.
      (3) README isolation section — the four-creators table from the spec §2 with the
      "after" column (fr / fr via WorktreeCreate / Claude default for agent-* / routed to fr).
      (4) `fr skills` overview text if it lists isolation verbs (grep for "isolation exec" in
      packages/fr/src/fr/commands). Run the unit suite once more (docs tripwires). Commit:
      `docs+rules: fr-worktree-override, session-binding docs, worktree conformity table`.
