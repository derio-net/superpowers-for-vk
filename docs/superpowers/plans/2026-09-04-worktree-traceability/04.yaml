  title: RED — up --print-path and down --worktree
  steps:
  - id: P4.T1.S1
    text: |
      RED: in tests/unit/test_isolation_sessions_cmd.py (phase 1 file) add, host mode:
      (a) `fr isolation up --branch feat/p --print-path` → exit 0, the LAST non-empty
      stdout line equals the worktree path, and stdout does NOT contain "isolation up:"
      (that line moved to stderr); (b) run it twice → same path, exit 0 (idempotent for
      an existing branch+worktree — `_git_worktree_add` already short-circuits);
      (c) `fr isolation down --worktree <that path>` from a cwd OUTSIDE the repo
      (tmp_path) → exit 0 and the state is gone; (d) `down --worktree /nonexistent` →
      exit 2 "no isolation workspace at". Run, confirm failures.
- number: 2
