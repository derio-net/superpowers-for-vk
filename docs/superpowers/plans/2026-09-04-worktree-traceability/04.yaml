- number: 4
  title: GREEN — fr-worktree-create.sh, fr-worktree-remove.sh, hooks.json
  steps:
  - id: P4.T4.S1
    text: |
      GREEN: create plugins/super-fr/hooks/fr-worktree-create.sh (chmod 755):

      #!/bin/bash
      # WorktreeCreate (spec 2026-09-04 §5.B.3): session worktrees become fr
      # workspaces; subagent worktrees (agent-*) keep Claude's default shape. The
      # LAST stdout line is the worktree path; everything else goes to stderr. A
      # registered hook cannot decline, so every branch below prints a path or exits 1.
      set -eu
      input=$(cat)
      name=$(printf '%s' "$input" | jq -r '.name // empty')
      cwd=$(printf '%s' "$input" | jq -r '.cwd // empty')
      session_id=$(printf '%s' "$input" | jq -r '.session_id // empty')
      [ -n "$name" ] && [ -n "$cwd" ] || { echo "fr-worktree-create: missing name or cwd" >&2; exit 1; }
      root=$(git -C "$cwd" rev-parse --show-toplevel 2>/dev/null) || { echo "fr-worktree-create: $cwd is not a git repo" >&2; exit 1; }

      mimic_default() {
        # Claude's default: <repo>/.claude/worktrees/<name>, detached at origin/HEAD (fresh) else HEAD.
        dir="$root/.claude/worktrees/$name"
        if [ -d "$dir" ]; then printf '%s\n' "$dir"; exit 0; fi
        mkdir -p "$root/.claude/worktrees"
        base=$(git -C "$root" rev-parse --verify -q origin/HEAD 2>/dev/null || git -C "$root" rev-parse HEAD)
        git -C "$root" worktree add --detach "$dir" "$base" >&2
        printf '%s\n' "$dir"
        exit 0
      }
      has_profile() { ls -d "$root"/.devcontainer/*/ >/dev/null 2>&1; }
      fr_enabled() { [ -d "$root/docs/superpowers/plans" ] || has_profile; }

      case "$name" in agent-*) mimic_default ;; esac
      if ! fr_enabled || ! command -v fr >/dev/null 2>&1; then mimic_default; fi

      branch="$name"; case "$name" in */*) ;; *) branch="wt/$name" ;; esac
      if [ -z "${FR_ISOLATION_TARGET:-}" ] && ! has_profile; then
        echo "fr-worktree-create: no devcontainer profile in $root — host-worktree mode for this worktree" >&2
        export FR_ISOLATION_TARGET=worktree
      fi
      out=$(fr isolation up --repo "$root" --branch "$branch" ${session_id:+--session "$session_id" --harness claude} --print-path) || {
        echo "fr-worktree-create: fr isolation up failed" >&2; exit 1; }
      path=$(printf '%s\n' "$out" | sed -e 's/\x1b\[[0-9;]*m//g' | awk 'NF{l=$0} END{print l}')
      [ -n "$path" ] && [ -d "$path" ] || { echo "fr-worktree-create: no worktree path from fr isolation up" >&2; exit 1; }
      printf '%s\n' "$path"

      (`${session_id:+…}` is unquoted on purpose so it expands to two/four words; shellcheck SC2086 may
      be silenced on that line.)
  - id: P4.T4.S2
    text: |
      GREEN: create plugins/super-fr/hooks/fr-worktree-remove.sh (chmod 755):

      #!/bin/bash
      # WorktreeRemove (spec 2026-09-04 §5.B.4). agent-* worktrees: plain git removal.
      # Everything else: `fr isolation down --worktree`, which keeps a workspace with an
      # open PR — the reason goes to stderr and `fr isolation status` still shows it.
      set -eu
      input=$(cat)
      path=$(printf '%s' "$input" | jq -r '.worktree_path // empty')
      [ -n "$path" ] || exit 0
      case "$path" in
        */.claude/worktrees/agent-*)
          common=$(git -C "$path" rev-parse --git-common-dir 2>/dev/null) || { rm -rf "$path"; exit 0; }
          case "$common" in /*) ;; *) common="$path/$common" ;; esac
          git -C "$(dirname "$common")" worktree remove --force "$path" >&2 || rm -rf "$path"
          exit 0 ;;
      esac
      command -v fr >/dev/null 2>&1 || exit 0
      fr isolation down --worktree "$path" >&2 || echo "fr-worktree-remove: fr isolation down refused for $path; workspace kept (see fr isolation status)" >&2
      exit 0

      hooks.json: add top-level "WorktreeCreate": [{"hooks": [{"type": "command", "command": "${CLAUDE_PLUGIN_ROOT}/hooks/fr-worktree-create.sh"}]}]
      and "WorktreeRemove": [...fr-worktree-remove.sh]. Extend test_plugin_hooks.py to assert both keys exist.
      Run test_hooks_worktree.py, test_plugin_hooks.py, the whole unit suite (Hermes hooks-sync tripwire:
      same treatment as phase 3). Commit:
      `feat(hooks): WorktreeCreate/WorktreeRemove — native Claude worktree sessions become fr workspaces`.
