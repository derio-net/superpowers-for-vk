    text: |
      GREEN (isolation_cmd.py `up`): add
      `print_path: bool = typer.Option(False, "--print-path", help="Print ONLY the worktree path on stdout (last line); everything else to stderr. For WorktreeCreate hooks.")`.
      Emit the "isolation up: …" line and the /add-dir tip with `err=print_path`, then
      `if print_path: typer.echo(str(state.worktree))`.
      (`down`): add `worktree: Path | None = typer.Option(None, "--worktree", help="Resolve the workspace by its worktree path (WorktreeRemove hooks).")`.
      When given: `wt = worktree.resolve()`; `matches = [s for s in list_states(wt) if s.worktree.resolve() == wt]`
      (list_states keys on the git common dir, which resolves from inside the worktree);
      if none → `_fail(IsolationError(f"no isolation workspace at {wt}"))`; else
      `state = matches[0]; root = state.repo_root` and continue with the normal single-workspace
      teardown (including the phase-1 detach_all). `list_states` on a non-git path must not
      raise — guard with `try/except IsolationError` or check `wt.is_dir()` first.
      Run Task 1 tests, confirm green.
