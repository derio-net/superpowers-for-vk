  steps:
  - id: P1.T1.S1
    text: |
      RED: create tests/unit/test_isolation_sessions.py. Fixtures: `home`
      (monkeypatch HOME to tmp_path/"home", set FR_SESSIONS_DIR to
      tmp_path/"sessions"), `repo` (git init -q -b main tmp_path/"repo",
      one commit), and `workspace(repo, branch)` helper that mkdirs
      tmp_path/"wt"/<slug> and calls
      `save_state(IsolationState(repo_root=repo, branch=branch,
      worktree=<that dir>, profile="host", created_at="2026-09-05T00:00:00+00:00"))`.
      Cases:
      (a) `IsolationState.model_validate_json` of a JSON WITHOUT a
      `sessions` key (the pre-feature file shape) loads with `sessions == []`;
      (b) `sessions.attach(repo, "feat/x", "sess-1", harness="claude")`
      returns a state whose `sessions` has one `SessionBinding` with
      `session_id == "sess-1"`, `harness == "claude"`, an ISO `attached_at`;
      `load_state(repo, "feat/x").sessions` matches; and
      `sessions.read_session_index("sess-1")` == {"session_id": "sess-1",
      "harness": "claude", "repo_root": str(repo), "branch": "feat/x",
      "worktree": str(<wt>), "profile": "host", "attached_at": <same>};
      (c) attach is idempotent — a second attach of sess-1 to feat/x
      leaves exactly one binding (attached_at refreshed);
      (d) single binding per session — attach sess-1 to feat/y after
      feat/x removes it from feat/x's state and the index now says feat/y;
      (e) `sessions.detach("sess-1")` returns ["feat/y"], the state has no
      binding and the index file is gone; detaching again returns [] and
      exits cleanly (idempotent);
      (f) `sessions.detach_all(state)` for a workspace with sess-1 and
      sess-2 returns both ids and removes both index files;
      (g) `sessions.stale_session_indexes()` lists (path, data) for an
      index whose `worktree` dir was rmtree'd, and for an index whose
      session is no longer in the state's `sessions`, but NOT for a
      healthy one;
      (h) `session_index_path("../x")` and `session_index_path("")` raise
      IsolationError.
      Run `uv run pytest -q --no-cov tests/unit/test_isolation_sessions.py`,
      confirm it fails on import (fr.isolation.sessions does not exist).
- number: 2
  title: GREEN — SessionBinding on IsolationState + sessions.py
  steps:
  - id: P1.T2.S1
    text: |
      GREEN (types.py): in packages/fr/src/fr/isolation/types.py add,
      above IsolationState:

      class SessionBinding(BaseModel):
          """One agent session attached to a workspace (spec 2026-09-04 §5.A)."""
          session_id: str
          harness: str = "unknown"   # claude | hermes | opencode | unknown
