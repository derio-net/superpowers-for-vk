  steps:
  - id: P1.T3.S1
    text: |
      RED: create tests/unit/test_isolation_sessions_cmd.py using
      `typer.testing.CliRunner` on `fr.cli.app`. Copy the `repo`, `fake_run`,
      `_no_real_gc_spawn` and `_default_mode` fixtures from
      tests/unit/test_isolation_cmd.py (do not import them across files —
      the existing file keeps its own), set FR_SESSIONS_DIR to tmp_path/"sessions",
      and for `up` tests set FR_ISOLATION_TARGET=worktree (host-worktree
      mode: no docker). Cases:
      (a) `fr isolation attach --session s1 --repo <repo> --branch feat/x`
      after a `save_state(...)` for feat/x → exit 0, stdout contains
      "attached s1 -> feat/x", index file exists;
      (b) attach with --branch omitted and TWO workspaces → exit 2, stderr
      "multiple isolation workspaces — specify --branch"; with exactly one
      workspace → binds it;
      (c) attach for a branch with no state → exit 2 "no isolation workspace";
      (d) `fr isolation detach --session s1` → exit 0, stdout
      "detached s1 <- feat/x"; again → exit 0, stdout "detached s1 (no binding)";
      (e) `fr isolation status --format json` (FR_ISOLATION_TARGET=worktree,
      fake_run) → each row has `sessions: [{session_id, harness, attached_at}]`;
      text output line ends with ` sessions=s1` (or `sessions=none`);
      `status --session s1` lists only s1's workspace;
      (f) `fr isolation up --branch feat/z --session s9 --harness claude`
      (host mode) → exit 0, `load_state(repo, "feat/z").sessions[0].session_id == "s9"`,
      index file for s9 exists;
      (g) `fr isolation down --branch feat/z` with s9 bound and the
      workspace having no PR (fake_run returns "" for gh) → exit 0, stderr
      contains "warning: sessions still attached: s9", index file for s9 removed.
      Run the file, confirm failures (commands/options do not exist).
- number: 4
  title: GREEN — wire the CLI
  steps:
  - id: P1.T4.S1
    text: |
      GREEN (isolation_cmd.py): in packages/fr/src/fr/commands/isolation_cmd.py
      `from fr.isolation import sessions as _sessions`. Add a shared resolver
      (mirrors exec's no-branch handling):

      def _resolve_single(root: Path, branch: str | None) -> IsolationState:
          if branch is not None:
              state = load_state(root, branch)
          else:
              states = list_states(root)
              if len(states) > 1:
                  _fail(IsolationError("multiple isolation workspaces — specify --branch: " + ", ".join(s.branch for s in states)))
              state = states[0] if states else None
          if state is None:
              _fail(IsolationError(f"no isolation workspace for branch {branch!r} — run `fr isolation up` first." if branch else "no isolation workspace — run `fr isolation up` first."))
          return state  # type: ignore[return-value]

      Then add the two commands:

      @isolation_app.command()
      def attach(
          session: str = typer.Option(..., "--session", help="Agent session id (from the harness hook payload)."),
          repo: Path = typer.Option(Path("."), help="Repo root (default: cwd)."),
          branch: str | None = typer.Option(None, help="Isolation branch (default: the single active workspace)."),
          harness: str = typer.Option("unknown", help="claude | hermes | opencode | unknown"),
      ) -> None:
          """Bind a session to a workspace (traceability; idempotent)."""
          root = _resolve_repo(repo)
          state = _resolve_single(root, branch)
          try:
              _sessions.attach(root, state.branch, session, harness=harness)
          except IsolationError as err:
              _fail(err)
              return
          typer.echo(f"attached {session} -> {state.branch}")

      @isolation_app.command()
      def detach(
          session: str = typer.Option(..., "--session"),
          repo: Path | None = typer.Option(None, help="Limit to this repo (default: wherever the session is bound)."),
          branch: str | None = typer.Option(None),
      ) -> None:
          """Unbind a session (idempotent; exit 0 when nothing was bound)."""
          try:
              gone = _sessions.detach(session, repo_root=repo.resolve() if repo else None, branch=branch)
          except IsolationError as err:
              _fail(err)
              return
          typer.echo(f"detached {session} <- {', '.join(gone)}" if gone else f"detached {session} (no binding)")

      Refactor `exec` and `down` to call `_resolve_single` instead of their
      inline copies (behaviour identical; tests in test_isolation_cmd.py stay green).
  - id: P1.T4.S2
    text: |
      GREEN (status / up / down): in `status` add
      `session: str | None = typer.Option(None, "--session", help="Only the workspace this session is bound to.")`;
      after computing `states`, `if session: states = [s for s in states if any(b.session_id == session for b in s.sessions)]`;
      after `rows = [...]`, `for row, s in zip(rows, states): row["sessions"] = [b.model_dump() for b in s.sessions]`;
      in the text line append `f" sessions={','.join(b.session_id for b in s.sessions) or 'none'}"`
      (zip rows with states in the print loop).
      In `up` add `session: str | None = typer.Option(None, "--session")` and
      `harness: str = typer.Option("unknown", "--harness")`; after the
      target's `up` returns: `if session: state = _sessions.attach(state.repo_root, state.branch, session, harness=harness)`
      (wrap in the same try/_fail).
      In `down` (single-workspace path) add `session: str | None = typer.Option(None, "--session", help="The calling session; excluded from the still-attached warning.")`;
      before `_target(root).down(state, force=force)`:
      `others = [b.session_id for b in state.sessions if b.session_id != session]`;
      `if others: typer.echo(f"warning: sessions still attached: {', '.join(others)} — they will be detached", err=True)`;
      `_sessions.detach_all(state)`. Do the same detach_all inside `_down_all`'s per-workspace loop.
      Run tests/unit/test_isolation_sessions_cmd.py and tests/unit/test_isolation_cmd.py, confirm green.
      Run `uv run pytest -q --no-cov tests/unit` for the whole package. Commit:
      `feat(isolation): session bindings — attach/detach verbs, per-session index, status/up/down wiring`.
