[project]
name = "fr-cncd"
version = "4.1.0"
description = "super-fr cncd adapter: thin HTTP runner projecting plans into the cncd ledger (POST /v1/ingest)"
requires-python = ">=3.11"
dependencies = ["fr", "fr-dispatch"]

[project.entry-points."fr.runners"]
cncd = "fr_cncd.runner:CncdRunner"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fr_cncd"]

[tool.uv.sources]
fr = { workspace = true }
fr-dispatch = { workspace = true }
